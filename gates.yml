  owner: kit
  scripts: [scripts/vgwort_urldiff.py, scripts/vgwort_lock.py]
  needs: built
  severity: blocking
  status: partial
  gap: >-
    Runs in NEUTRALITY MODE. It proves a change moved no URL. It cannot prove
    the URLs it defends are the ones registered at VG Wort, because the lock is
    derived from the built sitemap and no T.O.M. export exists yet. The
    filename says so — url-lock-provisional.csv. Becomes complete at 15.4.
  battery: false
  runs: pre-merge on the three live courses; blocking there since P0.8

