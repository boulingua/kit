# The gate register. Every check in this organisation has an ID here, and this
# file is the only place a check is defined.
#
# WHY IT IS A FILE AND NOT A SECTION OF THE PLAN. Nine `continue-on-error`
# suppressions accumulated in this org, and four gates were found that could
# not fail at all — one audited its own repository, one printed "passing
# trivially" on an empty manifest, one greped a PDF field while 432 PDFs
# shipped missing a different one, and one always skipped. None of that was
# dishonest. Each was a check whose definition lived in the workflow that ran
# it, so nothing outside that workflow could notice it had stopped meaning
# anything. A register in prose has the same defect; this one is read by
# `bin/kit` to build the battery and by `verify_gate_register.py` to check
# itself, so a gate that drifts from its description fails something.
#
# FIELDS
#   id        A1–A19 source · B1–B4 build · C1–C15 rendered · D1–D6 artefacts
#             · E1 deploy. IDs are permanent and never reused. A withdrawn
#             gate becomes status: withdrawn and keeps its number.
#   owner     which repo holds the implementation: kit, .github, curriculum
#   scripts   [] while planned. More than one is allowed where an ID's
#             contract genuinely has separable halves (A1, A12).
#   needs     what must exist before it can run:
#             source · built · materials · audio · none
#   severity  blocking | warn
#   ramp      REQUIRED when severity is warn. A warn gate with no route to
#             blocking is a suppression wearing a gate's clothes, and the
#             register verifier fails on one. This field is the difference
#             between "not yet" and "never".
#   status    live | partial | planned | withdrawn
#             partial REQUIRES `gap:` — what the ID promises and the script
#             does not yet do. An ID marked live whose script does half the
#             job is how a battery grows a hole nobody can see.
#   booked    REQUIRED when planned: the phase that delivers it.
#   battery   true if `kit check` runs it. A live gate outside the battery
#             must say where it runs instead, in `runs`.

version: 1
framework_pin: null   # A16 reads its thresholds from the curriculum checkout,
                      # never from a constant here — see S2's coverage rule.

gates:

# ── Stage A · source, before Hugo ────────────────────────────────────────────

- id: A1
  title: kit drift
  owner: .github
  scripts: [scripts/kit_drift.py, kit:scripts/verify_kit_lock.py]
  needs: source
  severity: blocking
  status: partial
  gap: >-
    Covers kit-owned code in a course, step-level continue-on-error, `|| true`
    on a gate command, the _materials/ digest lock, deploy.yml byte-equality
    with the template, and the absence of any second workflow beside the
    caller. Does NOT yet check the hugo.toml key allowlist or an override's
    kit_base minor distance.
  note: >-
    Until kit v1.21.0 this gate examined nothing in the battery. It reads its
    argument as an ORG checkout and iterates the directories under it; `kit
    check` hands every gate the REPO, so the "courses" were content/, static/
    and data/, none of them imported the kit, and it printed "0 course(s)
    checked — A1 OK". Green on all five, having compared nothing. It was
    invisible for as long as the gate register was aborting before the battery
    ran at all, which is the general shape of this org's gate failures: the
    outer fault hides the inner one.
  battery: true

