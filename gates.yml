  needs: source
  severity: blocking
  status: live
  battery: true
  note: >-
    EQS-1 governs units and says nothing about the other 89 marked pages in
    this organisation — glossaries, appendices, about pages. They carry
    registered marks exactly as units do and nothing examined them at all.

    It fails, and the findings are real: 20 marked pages below VG Wort's 1,800
    character Mindestumfang, 11 marked pages whose page_type is section, 9 with
    no author, and 22 fle pages that carry a mark while saying the content is
    still to come.

    The sources requirement is a WARNING, not a failure. Whether a page owes
    sources depends on whether it makes claims about the world, and a gate
    cannot tell a glossary of the course's own terminology from an appendix
    summarising external facts. Failing 48 pages on that distinction would
    teach people to stop reading the output.

