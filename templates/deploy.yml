# The caller. Byte-identical in every course, and deliberately so.
#
# The job body is `kit check --ci` and nothing else, and that is the contract:
# if it passes locally it passes here, because this runs exactly it. Any gate
# added to this file instead of to the battery breaks that property and is
# caught by the kit's own drift test.
#
# The explicit org commit must match the workflow ref and release-pins.json.
# Foundation changes are applied to every shared caller as one release set.
name: Build and deploy
on:
  push: { branches: [main] }
  # Pull requests run the whole battery and publish nothing. The reusable
  # workflow's deploy job is main-only and holds the write permissions on its
  # own; nothing here can publish from a branch.
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  course:
    uses: boulingua/.github/.github/workflows/course-build.yml@654c70d7a52ee6281b9394d59e762654d1df9f7f
    with:
      org_ref: 654c70d7a52ee6281b9394d59e762654d1df9f7f
