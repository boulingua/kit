name: platform
on:
  push:
    branches: [main, 'refine/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod}
      - uses: peaceiris/actions-hugo@v3
        with: {hugo-version: '0.159.2', extended: true}
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: python -m unittest discover -s tests -v
      - run: python scripts/test_blg_paths.py
      - run: python design/build_tokens.py --check
      - run: python scripts/verify_tokens.py
      - run: python scripts/verify_fonts.py
      - run: python scripts/verify_i18n_chrome.py
      - run: python scripts/verify_contrast.py
      - run: python scripts/build_example.py
