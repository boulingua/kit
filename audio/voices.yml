# voices.yml — the boulingua voice registry.
#
# This file is the single source of truth for Piper voice IDs. No voice ID is
# written anywhere else: not in a ROADMAP, not in a §11 dossier row, not in a
# README table, not in a download script. Everything that needs one reads it
# from here. A voice ID typed into prose is how a 404 gets into a build.
#
# It relocates to kit/audio/voices.yml at F1, unchanged in schema, and every
# consumer moves with it.
#
# Gate D6 refuses any row whose model_url does not resolve upstream, and any
# row carrying status: ready or status: candidate whose licence is not in the
# allow-list below. Both checks run before a single byte is downloaded.
#
# The licence rule. boulingua content ships under CC BY-SA 4.0. Audio
# synthesised from a Piper model inherits the licence of the model's training
# dataset, so a NonCommercial voice cannot go inside a CC BY-SA 4.0 work at
# all, and a voice whose dataset licence is unstated cannot be shipped safely
# either — "no statement" is not permission. licence: is copied verbatim from
# the voice's MODEL_CARD, including where upstream writes a bare URL or the
# words "See URL"; it is never normalised, summarised or guessed at.
# licence_ok: is the judgement made from it.
#
# status:
#   ready      — licence clear, voice in production, audio shipping today.
#   candidate  — licence clear, voice chosen, awaiting the Stage 3 audition
#                (bin/kit audio audition <code>). Nothing is generated from a
#                candidate row until auditions/<code>.md records verdict: pass.
#   none       — no usable voice. The course ships transcript-only: the unit
#                page still renders its <details> transcript, with no player.
#                This is a first-class state, not a failure.
#
# Keys are verbatim upstream and are not ASCII. pt_PT-tugão-medium carries ã
# in the key, the directory and the filename; transliterating that ã to a bare
# a yields a URL that returns 404. model_url is percent-encoded and must be
# used as given — never construct a path from a key.
#
# Voices are never substituted across languages. The fallback ladder is: the
# second voice in the same locale, then any allow-listed voice in the same
# language family, then transcript-only. Never a neighbouring language.

snapshot:
  source: https://huggingface.co/rhasspy/piper-voices/resolve/main/voices.json
  taken_at: 2026-08-21
  voices_in_catalogue: 174
  voices_in_boulingua_languages: 115

# A row may not carry status: ready or candidate unless its licence is in this list.
# Anything else — including an unstated licence — is a hard failure of gate D6.
licence_allowlist:
  - "CC0"
  - "public domain"
  - "Unlicense"
  - "CC BY 3.0"
  - "CC BY 4.0"
  - "CC BY-SA 4.0"
  - "Apache-2.0"
  - "MIT"

