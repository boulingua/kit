dialogue: >-
  Bonjour, est-ce que cette place est libre ? Oui, bien sûr. Vous allez à Lyon ?
  Non, je descends à Dijon. Le train arrive à quelle heure ? À onze heures vingt.
  Merci beaucoup. Je vous en prie, bon voyage !
vocabulary: >-
  Un élève, une école, la fenêtre, une fête, un garçon, ma sœur. Dessus, dessous.
  Le pain, le vin, le vent. Deux amis, les enfants. Un, onze, vingt et un, quatre-vingts.
continuous: >-
  Ce matin, Léa prépare une visite au musée avec sa classe. Elle met un carnet
  et un crayon dans son sac, puis elle rejoint ses amis devant l'école. Leur
  professeur explique le programme de la journée. Ils vont d'abord regarder
  les tableaux, puis travailler en petits groupes. À midi, ils mangeront dans
  le jardin si le temps le permet. Léa espère découvrir une œuvre qu'elle pourra
  présenter à sa sœur en rentrant chez elle.
