dialogue: >-
  Good morning. Is this the bus to the museum? Yes, it is. How much is a return ticket?
  Three pounds fifty, please. Thank you. Does the museum open at half past nine?
  No, it opens at ten on Thursdays. Then I have time for breakfast.
vocabulary: >-
  Ship, sheep, thin, this, thought, though, through. Read yesterday, read tomorrow.
  A present, to present. A photograph, a photographer. One, thirteen, thirty, one hundred.
continuous: >-
  On Saturday, Maya and her brother walk to the library. It has been raining all
  morning, but now the clouds are moving away. At the entrance, they meet their
  neighbour, who is returning a book about gardens. Maya chooses a story about
  a journey across the sea. Her brother asks the librarian for a book about
  trains. Before going home, they sit by the window and read the first few pages.
