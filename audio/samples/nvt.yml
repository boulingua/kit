dialogue: >-
  Goedemorgen. Waar vertrekt de trein naar Utrecht? Van spoor vijf. Moet ik overstappen?
  Nee, deze trein rijdt rechtstreeks. Hoe laat komt hij aan? Om kwart over tien.
  Dank u wel. Graag gedaan, en een goede reis!
vocabulary: >-
  IJs, mijn, fijn. Eén café, twee ideeën. Huis, muis, tuin. Boek, boeken.
  Huur, muur, buur. Schip, school, schrijven. Dertien, dertig, drieëndertig.
continuous: >-
  Op woensdag gaat Sam na school naar de bibliotheek. Hij zoekt een boek over
  dieren voor een spreekbeurt. De bibliothecaris laat hem zien waar de boeken
  staan. Sam kiest er twee en gaat aan een tafel bij het raam zitten. In zijn
  schrift noteert hij een paar vragen. Hoe leven deze dieren in de winter?
  Wat eten ze? Als zijn zus hem komt ophalen, heeft hij genoeg ideeën om
  thuis verder te werken. Samen fietsen ze langs het park naar huis.
