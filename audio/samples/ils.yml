dialogue: >-
  Buongiorno. Questo treno va a Firenze? Sì, ma deve cambiare a Bologna.
  Quanto tempo ho per cambiare? Circa venti minuti. Devo comprare un altro biglietto?
  No, questo è valido per tutto il viaggio. Grazie mille!
vocabulary: >-
  nonno / nono. pala / palla. Pena, penna. Casa, cassa. Anno, hanno.
  Città, perché, caffè. Gli amici, uno zaino. Quindici, cinquanta, cinquantacinque.
continuous: >-
  La domenica mattina, Luca apre la finestra e guarda il giardino. Durante la
  notte ha piovuto, ma adesso il cielo è azzurro. Sua sorella propone una
  passeggiata al parco. Prima di uscire preparano due panini e riempiono una
  bottiglia d'acqua. Al parco incontrano un'amica che sta leggendo sotto un
  albero. Si siedono con lei e parlano dei programmi per le vacanze. Poi
  fanno un giro intorno al laghetto e tornano a casa per pranzo.
