dialogue: >-
  Добрый день. Этот автобус идёт в центр? Да, идёт. Где можно купить билет?
  У водителя или в приложении. Сколько времени занимает поездка? Около двадцати минут.
  Большое спасибо. Счастливого пути!
vocabulary: >-
  Ёлка, ещё, подъезд, сыр. За́мок, замо́к. Молоко, хорошо. Шесть, щётка.
  Один друг, два друга. Тринадцать, тридцать. Где находится библиотека?
continuous: >-
  В субботу утром Анна идёт с братом в библиотеку. Она хочет найти книгу
  о птицах, которых видит в парке. Библиотекарь показывает им полку у
  окна. Анна выбирает две книги и садится за большой стол. Её брат
  предпочитает рассказ о путешествии на поезде. Через час они выходят
  на улицу. В парке они слышат пение птиц и пытаются узнать одну из
  них. Потом они возвращаются домой, чтобы приготовить обед и рассказать
  родителям о том, что узнали.
