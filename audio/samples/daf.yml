dialogue: >-
  Guten Tag. Fährt dieser Zug nach Köln? Ja, aber Sie müssen in Düsseldorf umsteigen.
  Wie viel Zeit habe ich dort? Zwölf Minuten. Reicht das? Normalerweise schon.
  Bitte achten Sie auf die Durchsagen. Vielen Dank für Ihre Hilfe.
vocabulary: >-
  Äpfel, schön, grün, Straße. Die Stadt, der Staat. Ofen, offen. Kirche, Kirsche.
  Ein Buch, viele Bücher. Sechzehn, sechzig, einundzwanzig. Eine E-Mail, zwei Fahrräder.
continuous: >-
  Am Freitag besucht Amir seine Großmutter. Sie wohnt in einem kleinen Dorf am
  Fluss. Gemeinsam gehen sie zum Markt und kaufen frisches Gemüse für das
  Abendessen. Auf dem Rückweg beginnt es zu regnen. Zum Glück haben beide einen
  Schirm dabei. Zu Hause kochen sie eine Suppe und erzählen sich von ihrer Woche.
  Später zeigt die Großmutter alte Fotos. Amir erkennt den Garten wieder, aber
  das Haus auf dem Bild sieht ganz anders aus als heute.
