dialogue: >-
  Dzień dobry. Czy ten autobus jedzie do centrum? Tak, proszę wsiadać.
  Gdzie mogę kupić bilet? W automacie obok drzwi. Ile trwa podróż?
  Około dwudziestu minut. Dziękuję za pomoc. Proszę bardzo!
vocabulary: >-
  Mąż, pięć, łódź, koń, góra, śnieg, źródło, żaba. Cześć, szczęście.
  Proszę, książka, dziewięć. Trzynaście, trzydzieści. W Szczecinie pada deszcz.
continuous: >-
  W sobotę rano Anna idzie z bratem do biblioteki. Chce znaleźć książkę o
  ptakach, które widuje w ogrodzie. Bibliotekarka pokazuje im półkę przy
  oknie. Anna wybiera dwie książki i siada przy dużym stole. Jej brat
  woli czytać opowiadanie o podróży pociągiem. Po godzinie wychodzą na
  spacer. W parku słyszą śpiew ptaków i próbują rozpoznać jeden z nich.
  Potem wracają do domu, żeby przygotować obiad i opowiedzieć rodzicom
  o tym, czego się dowiedzieli.
