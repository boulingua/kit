dialogue: >-
  Καλημέρα. Αυτό το λεωφορείο πηγαίνει στο κέντρο; Ναι, πηγαίνει. Πού μπορώ να αγοράσω εισιτήριο;
  Στο περίπτερο δίπλα στη στάση. Πόση ώρα διαρκεί η διαδρομή; Περίπου είκοσι λεπτά.
  Σας ευχαριστώ πολύ. Καλό ταξίδι!
vocabulary: >-
  Καλημέρα, ήλιος, σπίτι, πόλη, φύλλο, νερό. Ένα καΐκι, ένα χάδι που πραΰνει.
  Μήλο, μήλα. Φίλος, φύλλο. Δεκατρία, τριάντα. Πού είναι το βιβλίο μου;
continuous: >-
  Το Σάββατο η Μαρία πηγαίνει με τον αδελφό της στη βιβλιοθήκη. Θέλει να
  βρει ένα βιβλίο για τα ζώα της θάλασσας. Η βιβλιοθηκάριος τους δείχνει
  ένα ράφι κοντά στο παράθυρο. Η Μαρία διαλέγει δύο βιβλία και κάθεται
  σε ένα μεγάλο τραπέζι. Ο αδελφός της προτιμά μια ιστορία με εικόνες.
  Διαβάζουν για λίγη ώρα και μετά βγαίνουν στην πλατεία. Πριν γυρίσουν
  στο σπίτι, αγοράζουν ψωμί και συζητούν τι έμαθαν από τα βιβλία τους.
