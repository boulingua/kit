dialogue: >-
  سلام. این اتوبوس به مرکز شهر می‌رود؟ بله. از کجا می‌توانم بلیت بخرم؟
  می‌توانید از دستگاه کنار ایستگاه استفاده کنید. سفر چقدر طول می‌کشد؟ حدود بیست دقیقه.
  خیلی ممنون. خواهش می‌کنم.
vocabulary: >-
  کتاب، خانه، گربه، پدر، چای، ژاله. یک، دو، سه، چهار، پنج.
  شماره‌های ۰ تا ۹. سیزده، سی. امروز هوا خوب است. کتابخانه کجاست؟
continuous: >-
  صبح شنبه مریم با برادرش به کتابخانه می‌رود. او می‌خواهد کتابی دربارهٔ پرندگان پیدا کند،
  چون هر روز چند پرنده در باغ می‌بیند. کتابدار قفسه‌ای را کنار پنجره به آن‌ها نشان می‌دهد.
  مریم دو کتاب انتخاب می‌کند و پشت میز می‌نشیند. برادرش یک داستان دربارهٔ سفر با قطار برمی‌دارد.
  یک ساعت بعد از کتابخانه بیرون می‌آیند و به پارک می‌روند. آن‌ها صدای پرنده‌ای را می‌شنوند
  و سعی می‌کنند آن را پیدا کنند. سپس به خانه برمی‌گردند تا با خانواده ناهار بخورند.
