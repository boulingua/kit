dialogue: >-
  你好，请问，这辆公共汽车去市中心吗？去。在哪里可以买票？你可以在车上买。
  到市中心要多长时间？大约二十分钟。谢谢你的帮助。不客气，祝你一路顺风。
vocabulary: >-
  妈，麻，马，骂，吗。mā má mǎ mà ma。你好，中国，学校，朋友，图书馆。
  一个人，两本书，三杯水。十三，三十。今天星期几？今天星期三。
continuous: >-
  星期六早上，小林和姐姐一起去图书馆。小林想找一本介绍鸟类的书，因为他经常在公园里看见不同的鸟。
  图书馆的工作人员告诉他们，这些书放在窗户旁边的书架上。小林选了两本，坐下来认真地看。
  姐姐选了一本旅行故事。一个小时以后，他们离开图书馆，走到附近的公园。
  小林听见鸟叫，停下来看看树上。他想知道那是什么鸟。回家以后，他打算再查一查刚借来的书。
