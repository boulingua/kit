dialogue: >-
  Bom dia. Este comboio vai para Coimbra? Sim, vai. A que horas chega?
  Às onze e meia. É preciso reservar lugar? Para este comboio, não.
  Muito obrigado pela ajuda. De nada. Boa viagem!
vocabulary: >-
  Pão, coração, limões. Criança, açúcar, avô, avó. Câmara, três, português.
  Caro, carro. Quinze, cinquenta. Uma chávena de chá. Estação de comboios.
continuous: >-
  Na terça-feira, a Inês vai à biblioteca depois das aulas. Precisa de um
  livro para preparar um trabalho sobre o mar. A bibliotecária mostra-lhe
  uma estante com livros sobre animais e viagens. A Inês escolhe um livro
  sobre peixes e senta-se perto da janela. Tira o caderno da mochila e
  escreve algumas perguntas. Quando o irmão chega, ela já encontrou várias
  informações interessantes. Saem juntos e passam pela padaria antes de
  regressarem a casa.
