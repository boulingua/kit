dialogue: >-
  Hei! Går denne bussen til sentrum? Ja, det gjør den. Hvor kan jeg kjøpe billett?
  Du kan bruke appen eller betale her. Hvor lang tid tar turen? Omtrent tjue minutter.
  Takk for hjelpen. Bare hyggelig!
vocabulary: >-
  Lærer, søster, blå. Bøker, brød, grønnsaker. Kjøpe, kjøre, skjorte.
  En bok, boka, bøker, bøkene. Sju, sytten, sytti. Jeg bor i Norge og lærer norsk.
continuous: >-
  På søndag går Nora og familien hennes en tur langs sjøen. Det blåser litt,
  men sola skinner mellom skyene. De har med seg brød, ost og varm te i en sekk.
  Etter en stund finner de et sted der de kan sitte. Lillebroren ser en båt
  og spør hvor den skal. Nora vet ikke svaret. Kanskje den skal til øya der
  bestefar bor. Etter maten pakker de sammen og går hjem før det blir mørkt.
