dialogue: >-
  Добрий день. Цей автобус їде до центру? Так, їде. Де можна купити квиток?
  У водія або в застосунку. Скільки триває поїздка? Приблизно двадцять хвилин.
  Дуже дякую. Щасливої дороги!
vocabulary: >-
  Ґанок, ґудзик, їжак, єнот, Україна. П'ять, пʼять, сім'я, подвірʼя.
  Книга, книжка. Тринадцять, тридцять. Сьогодні гарна погода. Де є бібліотека?
continuous: >-
  У суботу вранці Олена йде з братом до бібліотеки. Вона хоче знайти
  книжку про птахів, яких бачить у парку. Бібліотекарка показує їм полицю
  біля вікна. Олена вибирає дві книжки й сідає за великий стіл. Її брат
  воліє читати оповідання про подорож потягом. Через годину вони виходять
  надвір. У парку вони чують спів птахів і намагаються впізнати одного
  з них. Потім повертаються додому, щоб приготувати обід і розповісти
  батькам про те, що дізналися.
