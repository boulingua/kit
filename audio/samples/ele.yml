dialogue: >-
  Buenos días. ¿Este autobús va al centro? Sí, pero tiene que bajar en la próxima plaza.
  ¿Cuánto cuesta el billete? Un euro con cincuenta. Muchas gracias. ¡Buen viaje!
vocabulary: >-
  Mañana, niño, España. Café, aquí, música. Pero, perro. Casa, caza.
  Está, están. Quince, cincuenta. ¿Qué hora es? Son las tres y media.
continuous: >-
  El sábado, Ana va al mercado con su abuelo. Quieren comprar verduras para
  preparar la comida. Primero eligen unos tomates y después buscan pan fresco.
  En una pequeña tienda, Ana encuentra un libro sobre las aves del barrio.
  Le pregunta a su abuelo si pueden leerlo juntos por la tarde. Él sonríe y
  dice que sí. De camino a casa, se sientan en un banco y observan a los
  pájaros que vuelan entre los árboles.
