# Deutsche Oberflächentexte.
#
# The German chrome vocabulary did not exist anywhere in this organisation
# until now — not in the kit, not in efl, fle, daf or website — while
# `chrome_language: de` is the default for all fifteen scaffolded courses. So
# every German course was one step away from an English interface, held back
# only by each repo carrying its own hand-written layouts.
#
# The wording is taken from daf's own layouts rather than translated fresh, so
# adopting the module changes no string a learner already reads.
