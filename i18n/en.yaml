# Chrome strings. Every key the kit's layouts reference must exist here and in
# every other language file, or gate A9 fails.
#
# The layouts carry `| default "…"` fallbacks so a missing key degrades to
# English rather than to blank. That is a safety net and not a licence: an
# English fallback on a German course reads as a bug to the learner, and the
# whole point of A9 is that it can never be reached silently.
