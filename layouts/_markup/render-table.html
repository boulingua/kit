{{- $headers := slice -}}
{{- range .THead -}}{{- range . -}}{{- $headers = $headers | append (.Text | plainify) -}}{{- end -}}{{- end -}}
<div class="table-scroll" role="region" tabindex="0" aria-label="{{ i18n "table" }}: {{ delimit $headers ", " }}">
<table{{ range $name, $value := .Attributes }}{{ if $value }}{{ printf " %s=%q" $name $value | safeHTMLAttr }}{{ end }}{{ end }}>
  <thead>{{ range .THead }}<tr>{{ range . }}<th scope="col"{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</th>{{ end }}</tr>{{ end }}</thead>
  <tbody>{{ range .TBody }}<tr>{{ range . }}<td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>{{ .Text }}</td>{{ end }}</tr>{{ end }}</tbody>
</table>
</div>
